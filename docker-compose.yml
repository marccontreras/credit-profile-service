services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: creditdb
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d creditdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/creditdb
      SPRING_DATASOURCE_USERNAME: credit
      SPRING_DATASOURCE_PASSWORD: credit
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
